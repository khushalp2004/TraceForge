events {
  worker_connections 2048;
}

http {
  # Cache for backend API responses
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dashboard_cache:10m max_size=100m inactive=60m use_temp_path=off;
  
  # Cache for frontend static assets
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=500m inactive=30d use_temp_path=off;

  # Backend upstream
  upstream backend {
    least_conn;
    server backend:3001 max_fails=3 fail_timeout=30s;
    server backend:3001 max_fails=3 fail_timeout=30s;
    server backend:3001 max_fails=3 fail_timeout=30s;
    server backend:3001 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  # Frontend upstream
  upstream frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  server {
    listen 80 http2;

    client_max_body_size 1M;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 100;

    # Enable Brotli compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Backend API routes - with caching
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;

      # Don't cache API routes by default
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Dashboard endpoint - with caching
    location /dashboard {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      proxy_cache dashboard_cache;
      proxy_cache_valid 200 10m;
      proxy_cache_valid 401 1m;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_background_update on;
      proxy_cache_lock on;

      add_header X-Cache-Status $upstream_cache_status;
    }

    # Next.js static assets - long cache for Cloudflare
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      # Serve directly from cache with very long TTL
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      # Set cache headers for Cloudflare
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
      
      # Bypass cache for revalidation
      proxy_cache_bypass $http_pragma $http_authorization;
    }

    # Static files - long cache for Cloudflare
    location /static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Images - long cache for Cloudflare
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Fonts - long cache for Cloudflare
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # CSS and JS files - long cache for Cloudflare
    location ~* \.(css|js)$ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Default backend routes
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;

      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
