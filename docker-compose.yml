services:
  db:
    image: postgres:16-alpine
    container_name: traceforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - traceforge_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: traceforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - traceforge_redis:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: traceforge-pgbouncer
    restart: unless-stopped
    environment:
      # PostgreSQL 14+ defaults to SCRAM-SHA-256; edoburu defaults to md5 without this.
      AUTH_TYPE: scram-sha-256
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 100
      MAX_CLIENT_CONN: 400
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 20
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 600
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "5432:5432"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  mailpit:
    image: axllent/mailpit:latest
    container_name: traceforge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  nginx:
    image: nginx:alpine
    container_name: traceforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - DISABLE_NGINX_RATE_LIMIT=${DISABLE_NGINX_RATE_LIMIT:-false}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=80
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      PORT: 3001
      API_ONLY: "true"
      WORKER_COUNT: 2
      GROQ_RATE_LIMIT_PER_MINUTE: 500
      GROQ_RATE_LIMIT_PER_HOUR: 10000
    restart: unless-stopped
    command: sh -c "npm run prisma:migrate:deploy && npm run start:cluster"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1.25G
        reservations:
          cpus: '0.5'
          memory: 640M

  realtime:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: traceforge-realtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=8
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      PORT: 3002
      NOTIFICATIONS_ONLY: "true"
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_WORKER_CONCURRENCY: 3
      GITHUB_ANALYSIS_WORKER_CONCURRENCY: 2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.4'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 192M

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:80}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:3002}
    container_name: traceforge-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:80}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:3002}
      NEXT_PUBLIC_SUPPORT_EMAIL: team@usetraceforge.com
    ports:
      - "${FRONTEND_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
volumes:
  traceforge_db:
  traceforge_redis:
