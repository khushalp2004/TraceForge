services:
  db:
    image: postgres:16-alpine
    container_name: traceforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - traceforge_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: traceforge-redis
    ports:
      - "6379:6379"
    volumes:
      - traceforge_redis:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: traceforge-pgbouncer
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MAX_CLIENT_CONN: 400
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "5432:5432"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  mailpit:
    image: axllent/mailpit:latest
    container_name: traceforge-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  nginx:
    image: nginx:alpine
    container_name: traceforge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: traceforge-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=80
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      PORT: 3001
      API_ONLY: "true"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run dev:cluster"
    depends_on:
      - db
      - pgbouncer
      - redis
      - mailpit
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 2.5G
        reservations:
          cpus: '1.5'
          memory: 1.5G

  realtime:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: traceforge-realtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=8
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      PORT: 3002
      NOTIFICATIONS_ONLY: "true"
    ports:
      - "3002:3002"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run prisma:generate && npm run dev"
    depends_on:
      - db
      - pgbouncer
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: traceforge-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=15
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_WORKER_CONCURRENCY: 5
      GITHUB_ANALYSIS_WORKER_CONCURRENCY: 2
    volumes:
      - ./apps/worker:/app
      - /app/node_modules
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run dev"
    depends_on:
      - db
      - pgbouncer
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: traceforge-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3002
      NEXT_PUBLIC_SUPPORT_EMAIL: team@usetraceforge.com
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  traceforge_db:
  traceforge_redis:
