[package]
name = "usetraceforge"
version = "1.0.3"
edition = "2021"
description = "TraceForge Rust SDK for unhandled panic logging"
license = "MIT"
repository = "https://github.com/khushalp2004/TraceForge"
exclude = ["target/*", "target/"]

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
dotenv = "0.15"
backtrace = "0.3"
